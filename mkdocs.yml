site_name: GRUZ documentation
site_description: User guide and reference for GRUZ, a macOS app that finds caches, build junk, Docker leftovers and remains of uninstalled apps, explains each item and removes only what you approve.
site_url: https://macolszewski.github.io/gruz_cleaner/
repo_url: https://github.com/macolszewski/gruz_cleaner
repo_name: macolszewski/gruz_cleaner
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Maciej Olszewski. Released under the MIT License.

theme:
  name: material
  logo: images/icon.png
  favicon: images/icon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/macolszewski/gruz_cleaner
      name: GRUZ on GitHub

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

exclude_docs: |
  requirements.txt

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - User guide:
      - guide/getting-started.md
      - guide/categories.md
      - guide/removing.md
      - guide/what-grew.md
      - guide/rust.md
      - guide/claude-mem.md
      - guide/settings.md
      - guide/command-line.md
  - Reference:
      - reference/architecture.md
      - reference/rules.md
      - reference/localization.md
      - reference/limitations.md
      - reference/faq.md
