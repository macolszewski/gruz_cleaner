name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS minutes are expensive: one job does everything that needs macOS.
  test:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Swift tests
        run: swift test

      - name: Localizations
        run: ./scripts/check-localizations.py

      - name: App bundle
        run: ./scripts/build-app.sh

  # The helper is plain Python, so it runs on Linux, including the real Chroma rebuild and query test.
  python:
    name: claude-mem helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Python helper tests (with real Chroma)
        env:
          CLEANER_TEST_CHROMA: "1"
        run: >
          uv run --no-project --python 3.13 --with "chromadb==1.5.9" --with "onnxruntime>=1.20" --with "protobuf<7"
          python -m unittest discover -s Tests/ClaudeMemoryReindexTests -v
