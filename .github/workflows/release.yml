name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Build and publish GRUZ.app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Tests already ran when the commit reached main; publish only if that CI run passed,
      # instead of paying for the macOS tests twice.
      - name: Require a passing CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json conclusion,status \
            -q '[.[] | select(.status == "completed")][0].conclusion')"
          if [ "$conclusion" != "success" ]; then echo "CI has not passed for $GITHUB_SHA (got: ${conclusion:-none})"; exit 1; fi

      - name: Build app
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh

      - name: Package
        run: ditto -c -k --keepParent build/GRUZ.app "GRUZ-${GITHUB_REF_NAME}.zip"

      - name: Release notes
        run: awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "GRUZ-${GITHUB_REF_NAME}.zip" --title "GRUZ ${GITHUB_REF_NAME}" --notes-file notes.md
