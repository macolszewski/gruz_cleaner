name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If GRUZ removed or offered to remove something it should not have, and it could cause data loss for others, please report it privately instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Scan
        2. Open category ...
        3. ...
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: GRUZ version or commit
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or `gruz-scan` output
      description: Remove anything private before pasting.
